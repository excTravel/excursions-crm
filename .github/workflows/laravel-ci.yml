name: Laravel CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 1. Быстрые проверки качества PHP (без MySQL и без Node.js)
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Security Audit (Composer)
        run: composer audit --locked

      - name: Run Linter (Pint)
        run: ./vendor/bin/pint --test

      - name: Run Static Analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

      - name: Check Code Complexity (<= 10)
        run: ./vendor/bin/phpcs --standard=Generic --sniffs=Generic.Metrics.CyclomaticComplexity app/

  # 2. Сборка фронта, JS-аудит и проверка дублирования кода (<= 3%)
  frontend:
    name: Frontend & Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Security Audit (NPM)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Frontend Assets
        run: npm run build

      - name: Check Code Duplication (<= 3%)
        run: npx --yes jscpd app/ --threshold 3 --silent

  # 3. Автотесты с реальной MySQL в RAM и быстрым покрытием (PCOV)
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (with PCOV)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, pdo_mysql
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key & Permissions
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Execute tests
        run: php artisan test --coverage --min=70

  # 4a. Проверка сборки Docker-образа на PR (параллельно, без пуша)
  docker-check:
    name: Docker Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4b. Публикация образа в GHCR на main (строго после зелёных проверок)
  docker-publish:
    name: Publish Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, frontend, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/exctravel/excursions-crm:latest
            ghcr.io/exctravel/excursions-crm:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
